# Copy this file to src/main/resources/application.properties and fill in your local values.
# Do not commit real credentials.

spring.application.name=ProductCatalogService

spring.datasource.url=jdbc:mysql://localhost:3306/product_catalog_service
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
#no password if all permissions are granted to user
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Optional environment-variable style override:
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_catalog_service}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

